<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site en maintenance - Retour rapide</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
      }

      body {
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      .maintenance-container {
        background-color: var(--card-bg);
        padding: 3rem 2rem;
        border-radius: 1rem;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.3),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
        max-width: 480px;
        width: 90%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .icon-wrapper {
        font-size: 3.5rem;
        margin-bottom: 1.5rem;
        animation: pulse 2s infinite;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      p {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      .status-badge {
        display: inline-block;
        background-color: rgba(56, 189, 248, 0.1);
        color: var(--accent);
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div class="maintenance-container">
      <div class="icon-wrapper">🛠️</div>
      <div class="status-badge">Maintenance en cours</div>
      <h1>Nous serons de retour très bientôt !</h1>
      <p>
        Notre site fait l'objet d'une mise à jour technique pour vous offrir une
        meilleure expérience. Merci pour votre patience.
      </p>
    </div>
  </body>
</html>
